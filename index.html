<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content-Security-Policy の meta はビルド時に csp.ts が <meta charset> の直後へ差し込む -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Cookie 同意（Consent Mode v2）。ハブ takushio2525.com の共用スクリプト。必ず Google タグより前に、同期で読む -->
    <script src="https://takushio2525.com/consent/consent.js"></script>

    <!-- Google tag (gtag.js) / GA4 測定 ID は takushio2525.com 一族で共通。
         初期化は CSP でインラインを禁じているため public/ga-init.js に置き、consent.js の後に同期で読む -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-30GVXMB0GH"></script>
    <script src="/ga-init.js"></script>

    <!-- AdSense のサイト所有権確認（メタタグ方式。広告ユニットは未配置） -->
    <meta name="google-adsense-account" content="ca-pub-3136871606832456" />

    <title>Font to Binary Converter</title>
    <meta
      name="description"
      content="ドットフォントを C / Arduino / Python など任意のバイナリ配列に変換する Web ツール。TTF/OTF のアップロード、ピクセル単位の編集、ビットパック出力に対応。インストール不要でブラウザだけで動作します。"
    />
    <link rel="canonical" href="https://font-to-bin.takushio2525.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Font to Binary Converter" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="Font to Binary Converter" />
    <meta
      property="og:description"
      content="ドットフォントを C / Arduino / Python など任意のバイナリ配列に変換する Web ツール。TTF/OTF のアップロード、ピクセル単位の編集、ビットパック出力に対応。インストール不要でブラウザだけで動作します。"
    />
    <meta property="og:url" content="https://font-to-bin.takushio2525.com/" />
    <meta property="og:image" content="https://font-to-bin.takushio2525.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Font to Binary Converter の操作画面" />

    <!-- X (Twitter) カード -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Font to Binary Converter" />
    <meta
      name="twitter:description"
      content="ドットフォントを C / Arduino / Python など任意のバイナリ配列に変換する Web ツール。TTF/OTF のアップロード、ピクセル単位の編集、ビットパック出力に対応。"
    />
    <meta name="twitter:image" content="https://font-to-bin.takushio2525.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1B3A5C" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
